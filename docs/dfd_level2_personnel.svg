<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2660 2060" width="2660" height="2060" role="img" aria-label="Security Personnel Management Data Flow Diagram Level 2, processes 2.1 to 2.4.">
  <defs>
    <marker id="ar" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L12 6 L0 12 Z" fill="#0B0B0C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="2660" height="2060" fill="#FFFFFF"/>

  <g font-family="'Segoe UI','Nunito Sans','Trebuchet MS',system-ui,sans-serif" fill="#0B0B0C">

    <text x="1330" y="120" font-size="60" font-weight="700" text-anchor="middle">Security Personnel Management DFD Level 2</text>

    <!-- ── Shapes ───────────────────────────────────────── -->
    <g fill="none" stroke="#0B0B0C" stroke-width="4">
      <!-- entity -->
      <rect x="120" y="880" width="360" height="300"/>
      <!-- processes -->
      <rect x="900" y="270"  width="500" height="300" rx="40"/>
      <line x1="900" y1="338" x2="1400" y2="338"/>
      <rect x="900" y="650"  width="500" height="300" rx="40"/>
      <line x1="900" y1="718" x2="1400" y2="718"/>
      <rect x="900" y="1060" width="500" height="320" rx="40"/>
      <line x1="900" y1="1128" x2="1400" y2="1128"/>
      <rect x="900" y="1500" width="500" height="340" rx="40"/>
      <line x1="900" y1="1568" x2="1400" y2="1568"/>
      <!-- data stores -->
      <rect x="1800" y="270"  width="640" height="110"/><line x1="1930" y1="270"  x2="1930" y2="380"/>
      <rect x="1800" y="420"  width="640" height="140"/><line x1="1930" y1="420"  x2="1930" y2="560"/>
      <rect x="1800" y="600"  width="640" height="200"/><line x1="1930" y1="600"  x2="1930" y2="800"/>
      <rect x="1800" y="1090" width="640" height="110"/><line x1="1930" y1="1090" x2="1930" y2="1200"/>
      <rect x="1800" y="1250" width="640" height="160"/><line x1="1930" y1="1250" x2="1930" y2="1410"/>
      <rect x="1800" y="1450" width="640" height="110"/><line x1="1930" y1="1450" x2="1930" y2="1560"/>
      <rect x="1800" y="1650" width="640" height="110"/><line x1="1930" y1="1650" x2="1930" y2="1760"/>
      <rect x="1800" y="1800" width="640" height="110"/><line x1="1930" y1="1800" x2="1930" y2="1910"/>
    </g>

    <!-- entity label -->
    <g font-size="46" text-anchor="middle">
      <text x="300" y="1045">Administrator</text>
    </g>

    <!-- process labels -->
    <g text-anchor="middle">
      <text x="1150" y="318"  font-size="40">2.1</text>
      <text x="1150" y="440"  font-size="44">Register Security</text>
      <text x="1150" y="495"  font-size="44">Personnel</text>

      <text x="1150" y="698"  font-size="40">2.2</text>
      <text x="1150" y="820"  font-size="44">Maintain Personnel</text>
      <text x="1150" y="875"  font-size="44">Profile</text>

      <text x="1150" y="1108" font-size="40">2.3</text>
      <text x="1150" y="1240" font-size="44">Deployment &amp;</text>
      <text x="1150" y="1295" font-size="44">Station Overview</text>

      <text x="1150" y="1548" font-size="40">2.4</text>
      <text x="1150" y="1690" font-size="44">Personnel Status</text>
      <text x="1150" y="1745" font-size="44">&amp; Removal</text>
    </g>

    <!-- data store labels -->
    <g text-anchor="middle">
      <text x="1865" y="340"  font-size="44">D16</text><text x="2185" y="340"  font-size="46">Counters tbl</text>
      <text x="1865" y="505"  font-size="44">D3</text> <text x="2185" y="505"  font-size="46">Auth Accounts tbl</text>
      <text x="1865" y="715"  font-size="44">D1</text> <text x="2185" y="715"  font-size="46">Employees tbl</text>
      <text x="1865" y="1160" font-size="44">D6</text> <text x="2185" y="1160" font-size="46">Schedules tbl</text>
      <text x="1865" y="1345" font-size="44">D12</text><text x="2185" y="1345" font-size="42">Duty Assignments tbl</text>
      <text x="1865" y="1520" font-size="44">D5</text> <text x="2185" y="1520" font-size="38">Rotation Assignments tbl</text>
      <text x="1865" y="1720" font-size="44">D8</text> <text x="2185" y="1720" font-size="40">Attendance Reports tbl</text>
      <text x="1865" y="1870" font-size="44">D14</text><text x="2185" y="1870" font-size="44">Leave Requests tbl</text>
    </g>

    <!-- ── Data flows ───────────────────────────────────── -->
    <g fill="none" stroke="#0B0B0C" stroke-width="4" marker-end="url(#ar)">
      <!-- administrator ↔ processes -->
      <polyline points="480,920 560,920 560,320 900,320"/>
      <polyline points="900,430 640,430 640,960 480,960"/>
      <polyline points="480,1000 720,1000 720,700 900,700"/>
      <polyline points="900,880 800,880 800,1040 480,1040"/>
      <polyline points="480,1120 700,1120 700,1180 900,1180"/>
      <polyline points="900,1300 400,1300 400,1180"/>
      <polyline points="300,1180 300,1620 900,1620"/>
      <polyline points="900,1740 200,1740 200,1180"/>
      <!-- 2.1 ↔ stores -->
      <polyline points="1400,300 1800,300"/>
      <polyline points="1800,350 1400,350"/>
      <polyline points="1400,460 1800,460"/>
      <polyline points="1400,540 1640,540 1640,640 1800,640"/>
      <!-- 2.2 ↔ stores -->
      <polyline points="1800,690 1700,690 1700,760 1400,760"/>
      <polyline points="1400,860 1740,860 1740,740 1800,740"/>
      <polyline points="1350,650 1350,610 1720,610 1720,520 1800,520"/>
      <!-- 2.3 ← stores -->
      <polyline points="1800,1140 1400,1140"/>
      <polyline points="1800,1300 1400,1300"/>
      <polyline points="1800,1470 1700,1470 1700,1350 1400,1350"/>
      <!-- 2.4 ↔ stores -->
      <polyline points="1800,1400 1520,1400 1520,1600 1400,1600"/>
      <polyline points="1800,1700 1400,1700"/>
      <polyline points="1800,1830 1400,1830"/>
      <polyline points="1400,1620 2520,1620 2520,720 2440,720"/>
      <polyline points="1100,1840 1100,1960 2580,1960 2580,480 2440,480"/>
    </g>

    <!-- ── Flow labels ──────────────────────────────────── -->
    <g font-size="32" text-anchor="middle">
      <!-- administrator -->
      <text x="690" y="302">Personnel Details &amp; Role</text>
      <text x="748" y="374">Generated ID &amp;</text>
      <text x="748" y="412">One-time Password</text>
      <text x="700" y="644">Search / Filter &amp;</text>
      <text x="700" y="682">Profile Update</text>
      <text x="650" y="984">Personnel List</text>
      <text x="650" y="1022">&amp; Profile</text>
      <text x="620" y="1102">View Deployment</text>
      <text x="660" y="1282">Current Station &amp; Post</text>
      <text x="600" y="1602">Status View / Remove Personnel</text>
      <text x="560" y="1690">Status: On Duty · Day Off ·</text>
      <text x="560" y="1728">On Leave · Absent</text>
      <!-- 2.1 -->
      <text x="1600" y="282">Next Sequence No.</text>
      <text x="1600" y="392">Sequence Value</text>
      <text x="1600" y="442">Store Credential Hash</text>
      <text x="1560" y="522">Save Personnel Record</text>
      <!-- 2.2 -->
      <text x="1620" y="672">Personnel Records</text>
      <text x="1570" y="842">Update Personnel Record</text>
      <text x="1520" y="592">Reset Password Hash</text>
      <!-- 2.3 -->
      <text x="1600" y="1122">Published Schedule</text>
      <text x="1600" y="1282">Current Duty &amp; Post</text>
      <text x="1560" y="1332">Monthly Placement</text>
      <!-- 2.4 -->
      <text x="1680" y="1438">Today's Duty Entries</text>
      <text x="1600" y="1682">Absent Records Today</text>
      <text x="1600" y="1812">Approved Leave Today</text>
      <text x="2020" y="1600">Deactivate / Delete Personnel Record</text>
      <text x="1900" y="1940">Delete Credential</text>
    </g>

  </g>
</svg>
