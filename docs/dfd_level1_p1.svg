<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1700" width="2400" height="1700" role="img" aria-label="Data Flow Diagram Level 1, sheet 1 of 3: User Management, Security Personnel Management and Station Management.">
  <defs>
    <marker id="ar" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L12 6 L0 12 Z" fill="#0B0B0C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="2400" height="1700" fill="#FFFFFF"/>

  <g font-family="'Segoe UI','Nunito Sans','Trebuchet MS',system-ui,sans-serif" fill="#0B0B0C">

