      <text x="1725" y="872"  font-size="44">D1</text><text x="2035" y="872"  font-size="44">Employees tbl</text>
      <text x="1725" y="1352" font-size="44">D2</text><text x="2035" y="1352" font-size="44">Stations tbl</text>
      <text x="1725" y="1542" font-size="44">D4</text><text x="2035" y="1542" font-size="40">Special Assignments tbl</text>
    </g>

    <!-- ── Data flows ───────────────────────────────────── -->
    <g fill="none" stroke="#0B0B0C" stroke-width="4" marker-end="url(#ar)">
      <polyline points="950,330 480,330"/>
      <polyline points="480,380 950,380"/>
      <polyline points="480,820 620,820 620,470 950,470"/>
      <polyline points="1350,345 1660,345"/>
      <polyline points="1350,405 1660,405"/>
      <polyline points="1830,430 1830,510 1350,510"/>
      <polyline points="1150,560 1150,800"/>
      <polyline points="1280,560 1280,740 2150,740 2150,800"/>
      <polyline points="480,885 950,885"/>
      <polyline points="480,950 950,950"/>
      <polyline points="950,1015 480,1015"/>
      <polyline points="1350,850 1660,850"/>
      <polyline points="1830,910 1830,980 1350,980"/>
      <polyline points="1300,800 1300,680 2020,680 2020,430"/>
      <polyline points="480,1080 700,1080 700,1330 950,1330"/>
      <polyline points="480,1145 660,1145 660,1420 950,1420"/>
      <polyline points="1350,1320 1660,1320"/>
      <polyline points="1830,1390 1830,1440 1350,1440"/>
      <polyline points="1350,1520 1660,1520"/>
    </g>

    <!-- ── Flow labels ──────────────────────────────────── -->
    <g font-size="32" text-anchor="middle">
      <text x="715" y="312">First Log-in Setup</text>
      <text x="715" y="414">Username and</text>
      <text x="715" y="450">Password</text>
      <text x="855" y="452">Log-in</text>
      <text x="1505" y="327">Verify Credentials</text>
      <text x="1505" y="387">Update Password</text>
      <text x="1590" y="492">Role and Access</text>
      <text x="1130" y="690" text-anchor="end">Verified Role</text>
      <text x="1715" y="722">Preferred Stations</text>
      <text x="715" y="811">Security Personnel</text>
      <text x="715" y="847">Type</text>
      <text x="715" y="932">Crud Operation</text>
      <text x="715" y="997">Generated ID &amp; Password</text>
      <text x="1505" y="790">Store Personnel</text>
      <text x="1505" y="826">Details</text>
      <text x="1590" y="962">All Security Personnel List</text>
      <text x="1660" y="662">Register Account</text>
      <text x="825" y="1284">Station &amp; Post</text>
      <text x="825" y="1320">Setup</text>
      <text x="805" y="1402">Special Assignment</text>
      <text x="1505" y="1302">Store Station Posts</text>
      <text x="1590" y="1422">Station List</text>
      <text x="1505" y="1502">Store Assignment</text>
    </g>

