    <!-- ── Shapes ───────────────────────────────────────── -->
    <g fill="none" stroke="#0B0B0C" stroke-width="4">
      <!-- entities -->
      <rect x="120" y="300" width="360" height="200"/>
      <rect x="120" y="790" width="360" height="390"/>
      <!-- processes -->
      <rect x="950" y="300"  width="400" height="260" rx="40"/>
      <line x1="950" y1="368" x2="1350" y2="368"/>
      <rect x="950" y="800"  width="400" height="260" rx="40"/>
      <line x1="950" y1="868" x2="1350" y2="868"/>
      <rect x="950" y="1260" width="400" height="300" rx="40"/>
      <line x1="950" y1="1328" x2="1350" y2="1328"/>
      <!-- data stores -->
      <rect x="1660" y="320"  width="620" height="110"/><line x1="1790" y1="320"  x2="1790" y2="430"/>
      <rect x="1660" y="800"  width="620" height="110"/><line x1="1790" y1="800"  x2="1790" y2="910"/>
      <rect x="1660" y="1280" width="620" height="110"/><line x1="1790" y1="1280" x2="1790" y2="1390"/>
      <rect x="1660" y="1470" width="620" height="110"/><line x1="1790" y1="1470" x2="1790" y2="1580"/>
    </g>

    <!-- entity labels -->
    <g font-size="46" text-anchor="middle">
      <text x="300" y="378">Security</text>
      <text x="300" y="433">Personnel</text>
      <text x="300" y="1000">Administrator</text>
    </g>

    <!-- process labels -->
    <g text-anchor="middle">
      <text x="1150" y="348"  font-size="40">1.0</text>
      <text x="1150" y="448"  font-size="42">User</text>
      <text x="1150" y="502"  font-size="42">Management</text>
      <text x="1150" y="848"  font-size="40">2.0</text>
      <text x="1150" y="928"  font-size="40">Security</text>
      <text x="1150" y="973"  font-size="40">Personnel</text>
      <text x="1150" y="1018" font-size="40">Management</text>
      <text x="1150" y="1308" font-size="40">3.0</text>
      <text x="1150" y="1425" font-size="42">Station</text>
      <text x="1150" y="1478" font-size="42">Management</text>
    </g>

    <!-- data store labels -->
    <g text-anchor="middle">
